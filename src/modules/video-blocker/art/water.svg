<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <style>
    .drop { animation: fall 1.6s ease-in infinite; }
    .level { animation: fill 3.2s ease-in-out infinite alternate; transform-origin: 60px 100px; }
    @keyframes fall { from { transform: translateY(-14px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(34px); opacity: 0; } }
    @keyframes fill { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .drop, .level { animation: none; } }
  </style>
  <defs><clipPath id="glass"><path d="M36 40h48l-6 60H42z"/></clipPath></defs>
  <path class="drop" d="M60 10c5 7 8 11 8 15a8 8 0 0 1-16 0c0-4 3-8 8-15z" fill="#7cc8ff"/>
  <g clip-path="url(#glass)"><rect class="level" x="30" y="56" width="60" height="44" fill="#3d9be9"/></g>
  <path d="M36 40h48l-6 60H42z" fill="none" stroke="#f2f2f2" stroke-width="4" stroke-linejoin="round"/>
</svg>
